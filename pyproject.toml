[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "uae-document-intelligence-ai"
version = "0.1.0"
description = "UAE-focused bilingual enterprise document intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx==0.28.1",
  "pdfminer.six==20260107",
  "pdfplumber==0.11.10",
  "Pillow==13.0.0",
  "pypdfium2==5.12.1",
  "pytesseract==0.3.13",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
embedding-pilot = [
  "tiktoken==0.12.0",
]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
  "reportlab==3.6.13",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py311"
