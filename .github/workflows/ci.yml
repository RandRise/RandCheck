name: Local portfolio checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [workflow, backend, web, python, fixture, audits]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run declared checks
        shell: pwsh
        run: ./tools/ci/check.ps1 -Group '${{ matrix.group }}'
      - name: Retain bounded synthetic summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ matrix.group }}
          retention-days: 7
          if-no-files-found: error
          path: |
            outputs/ci/**/summary.json
            outputs/ci/**/backend-counts.json
            outputs/ci/**/web-checks.json
            outputs/ci/**/web-counts.json
            outputs/ci/**/workflow-checks.json
            outputs/ci/**/demo-health-tests.json
            outputs/ci/**/python-*.json
            outputs/ci/**/audit-*.json
            !outputs/ci/**/browser-review/**
