<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
  <title id="title">Administration layout proposal with fictional people</title>
  <desc id="desc">One Administration sidebar entry opens People and access. Activity history and Document storage are adjacent section links. A people list sits beside an access editor. This is a non-interactive illustration, not a live Admin account.</desc>
  <rect width="1120" height="740" fill="#1c1d21"/>
  <rect width="210" height="740" fill="#26272d"/>
  <path d="M210 0V740M210 80H1120" stroke="#42434d"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f3f3f7">
    <text x="24" y="43" font-weight="600">Document review</text>
    <text x="24" y="88" fill="#bfc0cd">Example Trading</text>
    <text x="24" y="157">Home</text>
    <text x="24" y="201">Document library</text>
    <text x="24" y="259" fill="#bfc0cd">Other tools</text>
    <rect x="14" y="291" width="182" height="46" rx="8" fill="#39334f" stroke="#858692"/>
    <text x="29" y="320" fill="#d5ccff" font-weight="600">Administration</text>
    <text x="24" y="684" fill="#bfc0cd" font-size="13">Fictional company</text>
    <text x="24" y="705" fill="#bfc0cd" font-size="13">Illustration only</text>
    <text x="240" y="34" font-weight="600">Sample Admin view</text>
    <text x="240" y="57" fill="#bfc0cd" font-size="13">Proposal · No real access changes</text>
    <rect x="929" y="23" width="157" height="36" rx="7" fill="#26272d" stroke="#858692"/>
    <text x="946" y="47" font-size="14">Appearance: Dark</text>
    <text x="240" y="130" font-size="28" font-weight="600">Administration</text>
    <text x="240" y="160" fill="#bfc0cd">Manage people and keep company records protected.</text>
    <path d="M240 229H1086" stroke="#42434d"/>
    <rect x="240" y="185" width="177" height="44" rx="6" fill="#39334f"/>
    <text x="259" y="213" fill="#d5ccff" font-weight="600">People &amp; access</text>
    <text x="445" y="213">Activity history</text>
    <text x="625" y="213">Document storage</text>
    <text x="240" y="281" font-size="20" font-weight="600">People &amp; access</text>
    <text x="240" y="307" fill="#bfc0cd" font-size="14">Choose a person to view or change their access.</text>
    <rect x="952" y="257" width="134" height="42" rx="8" fill="#7060df" stroke="#d5ccff"/>
    <text x="976" y="284" fill="#fff" font-weight="600">Add person</text>
    <rect x="240" y="332" width="515" height="319" rx="10" fill="#26272d" stroke="#42434d"/>
    <text x="258" y="365" fill="#bfc0cd" font-size="13">NAME</text>
    <text x="417" y="365" fill="#bfc0cd" font-size="13">ROLE</text>
    <text x="491" y="365" fill="#bfc0cd" font-size="13">ACCESS</text>
    <path d="M240 382H755M240 448H755M240 514H755M240 580H755" stroke="#42434d"/>
    <text x="258" y="421">Maya (you)</text><text x="417" y="421">Admin</text><text x="491" y="421">Active</text>
    <rect x="630" y="398" width="108" height="36" rx="6" fill="#26272d" stroke="#858692"/><text x="645" y="422" font-size="13">Edit access</text>
    <rect x="241" y="449" width="513" height="64" fill="#39334f"/>
    <text x="258" y="486" fill="#d5ccff">Omar</text><text x="417" y="486">Staff</text><text x="491" y="486">Active</text>
    <text x="651" y="486" fill="#d5ccff" font-size="13">Editing</text>
    <text x="258" y="552">Lina</text><text x="417" y="552">Staff</text><text x="491" y="552">Removed</text>
    <rect x="630" y="528" width="108" height="36" rx="6" fill="#26272d" stroke="#858692"/><text x="645" y="552" font-size="13">Edit access</text>
    <text x="258" y="613" fill="#bfc0cd" font-size="13">3 fictional people shown · not a live count</text>
    <rect x="775" y="332" width="311" height="319" rx="10" fill="#26272d" stroke="#42434d"/>
    <text x="796" y="366" font-size="19" font-weight="600">Edit Omar’s access</text>
    <text x="796" y="396" fill="#bfc0cd" font-size="14">Current role: Staff</text>
    <text x="796" y="436">Role</text>
    <rect x="796" y="449" width="268" height="41" rx="7" fill="#26272d" stroke="#858692"/>
    <text x="812" y="476">Staff</text><path d="m1038 466 6 6 6-6" stroke="#bfc0cd" fill="none"/>
    <text x="796" y="514" fill="#bfc0cd" font-size="13">Staff reviews and compares documents.</text>
    <rect x="796" y="532" width="16" height="16" rx="3" fill="#39334f" stroke="#d5ccff"/>
    <path d="m799 540 3 3 7-8" stroke="#d5ccff" stroke-width="2" fill="none"/>
    <text x="822" y="545" font-size="14">Active access</text>
    <rect x="796" y="567" width="136" height="40" rx="7" fill="#7060df" stroke="#d5ccff"/>
    <text x="810" y="593" fill="#fff" font-size="13" font-weight="600">Save changes</text>
    <rect x="944" y="567" width="120" height="40" rx="7" fill="#26272d" stroke="#858692"/>
    <text x="972" y="593" font-size="13">Cancel</text>
    <text x="796" y="635" fill="#bfc0cd" font-size="13">Access changes are recorded.</text>
    <text x="240" y="689" fill="#bfc0cd" font-size="14">Keep at least one active Admin. Removing access keeps earlier work.</text>
    <text x="240" y="717" fill="#bfc0cd" font-size="13">Layout proposal only · no buttons or account changes are active in this picture</text>
  </g>
</svg>
