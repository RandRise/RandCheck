<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">What we have checked</title>
  <desc id="desc">Four separate checks passed with fictional data. A complete upload flow, scanned files and real sign-in still need verification.</desc>
  <rect width="1040" height="620" rx="24" fill="#202126"/>
  <g font-family="Arial, sans-serif" fill="#f5f5f7">
    <text x="44" y="58" font-size="30" font-weight="700">What we have checked</text>
    <text x="44" y="91" font-size="18" fill="#c5c5d0">Prepared test data. These checks do not prove the full upload process.</text>
    <g fill="#30313a" stroke="#77718f">
      <rect x="44" y="122" width="952" height="78" rx="12"/>
      <rect x="44" y="218" width="952" height="78" rx="12"/>
      <rect x="44" y="314" width="952" height="78" rx="12"/>
      <rect x="44" y="410" width="952" height="78" rx="12"/>
    </g>
    <g font-size="22" font-weight="700">
      <text x="66" y="154">1. Large sample list</text>
      <text x="66" y="250">2. Real library and database</text>
      <text x="66" y="346">3. Real browser and saved reviews</text>
      <text x="66" y="442">4. Native PDF reading, checked separately</text>
    </g>
    <g font-size="18" fill="#dedce9">
      <text x="66" y="182">1,000 and 10,000 fictional entries: pages, search and filters passed.</text>
      <text x="66" y="278">10 files per page. Supplier search found a file beyond page 1.</text>
      <text x="66" y="374">12 passed + 1 differed. A saved decision kept the difference.</text>
      <text x="66" y="470">2 English PDFs. Missing facts stayed marked as missing.</text>
    </g>
    <rect x="44" y="514" width="952" height="78" rx="12" fill="#403726" stroke="#cfb46e"/>
    <text x="66" y="547" font-size="22" font-weight="700">Still needed</text>
    <text x="66" y="575" font-size="18">Full upload processing, scans, real sign-in, exports and your manual review.</text>
  </g>
</svg>
