<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
<title id="title">The workflow today</title><desc id="desc">New checks use an invoice and purchase order only. Earlier quotation work remains in saved cases. Nine steps, read left to right across each row. Document and comparison steps exist in code. Reviewed export is still planned.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8293a5" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif}</style>
<rect x="0" y="0" width="1040" height="720" rx="0" fill="#f6f8fb"/>
<text x="40" y="38" font-size="13" fill="#176b5b" font-weight="700" letter-spacing="1.5">02 / CURRENT WORKFLOW</text>
<text x="40" y="77" font-size="29" fill="#17283d" font-weight="700" >New invoice + PO checks, step by step.</text>
<rect x="40" y="112" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="68" cy="141" r="16" fill="#e8f5ef"/>
<text x="68" y="147" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">1</text>
<text x="60" y="183" font-size="20" fill="#17283d" font-weight="650" >Add documents</text>
<text x="60" y="212" font-size="16" fill="#56667a" font-weight="400" >Read the invoice and PO.</text>
<text x="60" y="235" font-size="16" fill="#56667a" font-weight="400" >Values are suggestions.</text>
<path d="M335 181 H368" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="376" y="112" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="404" cy="141" r="16" fill="#e8f5ef"/>
<text x="404" y="147" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">2</text>
<text x="396" y="183" font-size="20" fill="#17283d" font-weight="650" >Save the pair</text>
<text x="396" y="212" font-size="16" fill="#56667a" font-weight="400" >Choose each document.</text>
<text x="396" y="235" font-size="16" fill="#56667a" font-weight="400" >Save both selections.</text>
<path d="M671 181 H704" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="112" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="740" cy="141" r="16" fill="#e8f5ef"/>
<text x="740" y="147" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">3</text>
<text x="732" y="183" font-size="20" fill="#17283d" font-weight="650" >Review the values</text>
<text x="732" y="212" font-size="16" fill="#56667a" font-weight="400" >Check one value at a time.</text>
<text x="732" y="235" font-size="16" fill="#56667a" font-weight="400" >Keep, change, or leave out.</text>
<path d="M856 260 V276 H184 V297" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="305" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="68" cy="334" r="16" fill="#e8f5ef"/>
<text x="68" y="340" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">4</text>
<text x="60" y="376" font-size="20" fill="#17283d" font-weight="650" >Choose the reviews</text>
<text x="60" y="405" font-size="16" fill="#56667a" font-weight="400" >Choose and use each</text>
<text x="60" y="428" font-size="16" fill="#56667a" font-weight="400" >completed saved version.</text>
<path d="M335 374 H368" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="376" y="305" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="404" cy="334" r="16" fill="#e8f5ef"/>
<text x="404" y="340" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">5</text>
<text x="396" y="376" font-size="20" fill="#17283d" font-weight="650" >Choose invoice scope</text>
<text x="396" y="405" font-size="16" fill="#56667a" font-weight="400" >Whole order, part of it,</text>
<text x="396" y="428" font-size="16" fill="#56667a" font-weight="400" >or not sure.</text>
<path d="M671 374 H704" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="305" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="740" cy="334" r="16" fill="#e8f5ef"/>
<text x="740" y="340" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">6</text>
<text x="732" y="376" font-size="20" fill="#17283d" font-weight="650" >Compare the pair</text>
<text x="732" y="405" font-size="16" fill="#56667a" font-weight="400" >Check AED on both documents.</text>
<text x="732" y="428" font-size="16" fill="#56667a" font-weight="400" >Then check the usable facts.</text>
<path d="M856 453 V469 H184 V490" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="498" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="68" cy="527" r="16" fill="#e8f5ef"/>
<text x="68" y="533" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">7</text>
<text x="60" y="569" font-size="20" fill="#17283d" font-weight="650" >Inspect the evidence</text>
<text x="60" y="598" font-size="16" fill="#56667a" font-weight="400" >Read differences and</text>
<text x="60" y="621" font-size="16" fill="#56667a" font-weight="400" >what could not be checked.</text>
<path d="M335 567 H368" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="376" y="498" width="288" height="140" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<circle cx="404" cy="527" r="16" fill="#e8f5ef"/>
<text x="404" y="533" font-size="17" fill="#176b5b" font-weight="700" text-anchor="middle">8</text>
<text x="396" y="569" font-size="20" fill="#17283d" font-weight="650" >Record a decision</text>
<text x="396" y="598" font-size="16" fill="#56667a" font-weight="400" >Choose an action and</text>
<text x="396" y="621" font-size="16" fill="#56667a" font-weight="400" >save the reason.</text>
<path d="M671 567 H704" fill="none" stroke="#8293a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="498" width="288" height="140" rx="12" fill="#f5f0fc" stroke="#b69bcc" stroke-width="1.5" stroke-dasharray="7 6"/>
<circle cx="740" cy="527" r="16" fill="#e8def5"/>
<text x="740" y="533" font-size="17" fill="#70429e" font-weight="700" text-anchor="middle">9</text>
<text x="732" y="569" font-size="20" fill="#17283d" font-weight="650" >Export reviewed results</text>
<text x="732" y="598" font-size="16" fill="#56667a" font-weight="400" >PLANNED — not built yet.</text>
<text x="732" y="621" font-size="16" fill="#56667a" font-weight="400" >Keep screen and CSV in sync.</text>
<text x="40" y="696" font-size="18" fill="#176b5b" font-weight="650" >Saving a document is not confirming its values. No missing check becomes a match.</text>
</svg>
