<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">An order and an invoice</title><desc id="desc">Illustration only. Ten chairs cost AED 100 each on the order and AED 110 each on the invoice. With the same checked basis, the example difference is AED 100 before tax.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8293a5" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif}</style>
<rect x="0" y="0" width="1040" height="550" rx="0" fill="#f6f8fb"/>
<text x="40" y="38" font-size="13" fill="#176b5b" font-weight="700" letter-spacing="1.5">01 / UNDERSTAND THE JOB</text>
<text x="40" y="77" font-size="29" fill="#17283d" font-weight="700" >Compare what we ordered with what we were billed.</text>
<rect x="45" y="117" width="450" height="311" rx="12" fill="#e5eaf0"/>
<rect x="40" y="108" width="450" height="311" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<rect x="40" y="108" width="450" height="7" rx="0" fill="#176b5b"/>
<text x="64" y="151" font-size="16" fill="#176b5b" font-weight="700" >PURCHASE ORDER</text>
<text x="64" y="190" font-size="26" fill="#17283d" font-weight="700" >PO-204</text>
<text x="64" y="223" font-size="17" fill="#56667a" font-weight="400" >Al Noor Supplies</text>
<text x="460" y="223" font-size="20" fill="#17283d" font-weight="400" text-anchor="start" direction="rtl">شركة النور</text>
<path d="M64 244 H466" fill="none" stroke="#e4e9ee" stroke-width="2"/>
<text x="64" y="277" font-size="14" fill="#56667a" font-weight="400" >Item</text>
<text x="64" y="307" font-size="21" fill="#17283d" font-weight="650" >10 chairs</text>
<text x="292" y="277" font-size="14" fill="#56667a" font-weight="400" >AED / each</text>
<text x="292" y="307" font-size="24" fill="#176b5b" font-weight="700" >100.00</text>
<rect x="60" y="334" width="410" height="61" rx="12" fill="#f4f7fa"/>
<text x="74" y="371" font-size="17" fill="#56667a" font-weight="400" >Before tax</text>
<text x="292" y="371" font-size="24" fill="#17283d" font-weight="700" >1,000.00</text>
<rect x="555" y="117" width="450" height="311" rx="12" fill="#e5eaf0"/>
<rect x="550" y="108" width="450" height="311" rx="12" fill="white" stroke="#d4dce5" stroke-width="1.5"/>
<rect x="550" y="108" width="450" height="7" rx="0" fill="#934514"/>
<text x="574" y="151" font-size="16" fill="#934514" font-weight="700" >SUPPLIER INVOICE</text>
<text x="574" y="190" font-size="26" fill="#17283d" font-weight="700" >INV-318</text>
<text x="574" y="223" font-size="17" fill="#56667a" font-weight="400" >Al Noor Supplies</text>
<text x="970" y="223" font-size="20" fill="#17283d" font-weight="400" text-anchor="start" direction="rtl">شركة النور</text>
<path d="M574 244 H976" fill="none" stroke="#e4e9ee" stroke-width="2"/>
<text x="574" y="277" font-size="14" fill="#56667a" font-weight="400" >Item</text>
<text x="574" y="307" font-size="21" fill="#17283d" font-weight="650" >10 chairs</text>
<text x="802" y="277" font-size="14" fill="#56667a" font-weight="400" >AED / each</text>
<text x="802" y="307" font-size="24" fill="#934514" font-weight="700" >110.00</text>
<rect x="570" y="334" width="410" height="61" rx="12" fill="#f4f7fa"/>
<text x="584" y="371" font-size="17" fill="#56667a" font-weight="400" >Before tax</text>
<text x="802" y="371" font-size="24" fill="#17283d" font-weight="700" >1,100.00</text>
<circle cx="520" cy="272" r="23" fill="#e4ecea"/>
<text x="520" y="279" font-size="24" fill="#176b5b" font-weight="700" text-anchor="middle">↔</text>
<rect x="40" y="450" width="960" height="64" rx="12" fill="#fff0e4" stroke="#ebc19f" stroke-width="1.5"/>
<text x="62" y="477" font-size="21" fill="#934514" font-weight="700" >Example difference: AED 10 per chair × 10 chairs = AED 100</text>
<text x="62" y="501" font-size="16" fill="#934514" font-weight="400" >Only when item, unit, currency, price basis and row coverage are checked.</text>
</svg>
