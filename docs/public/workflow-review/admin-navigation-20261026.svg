<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Administration navigation and people access flow</title>
  <desc id="desc">Admin opens Administration. People and access, Activity history and Document storage are separate sections. In People, choose a person, set access, then save and check the result. If the result is unclear, reload and inspect before choosing again.</desc>
  <rect width="960" height="440" rx="16" fill="#1d1e22"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#f5f5f7">
    <text x="480" y="38" font-size="22" font-weight="600">One place for administration</text>
    <rect x="350" y="58" width="260" height="56" rx="9" fill="#39344f" stroke="#beb2ee"/>
    <text x="480" y="91" font-size="17">Admin opens Administration</text>
    <path d="M480 114V137M170 137H790M170 137V157M480 137V157M790 137V157" fill="none" stroke="#b7b8c3" stroke-width="2"/>
    <g fill="#27282e" stroke="#777984">
      <rect x="40" y="157" width="260" height="72" rx="9"/>
      <rect x="350" y="157" width="260" height="72" rx="9"/>
      <rect x="660" y="157" width="260" height="72" rx="9"/>
    </g>
    <text x="170" y="187" font-size="18" font-weight="600">People &amp; access</text>
    <text x="170" y="211" font-size="13" fill="#b8dccb">Sample review accepted</text>
    <text x="480" y="187" font-size="18">Activity history</text>
    <text x="480" y="211" font-size="13" fill="#b8dccb">New layout; review open</text>
    <text x="790" y="187" font-size="18">Document storage</text>
    <text x="790" y="211" font-size="13" fill="#c1c2cb">Existing page; redesign planned</text>
    <path d="M170 229V270" fill="none" stroke="#b7b8c3" stroke-width="2"/>
    <text x="480" y="257" font-size="13" fill="#c1c2cb">These are separate tasks, not steps you must finish in order.</text>
    <g fill="#27282e" stroke="#777984">
      <rect x="40" y="280" width="260" height="56" rx="9"/>
      <rect x="350" y="280" width="260" height="56" rx="9"/>
      <rect x="660" y="280" width="260" height="56" rx="9"/>
    </g>
    <path d="M170 270V280M300 308H344L336 303M344 308L336 313M610 308H654L646 303M654 308L646 313" fill="none" stroke="#b7b8c3" stroke-width="2"/>
    <text x="170" y="314" font-size="17">1. Choose a person</text>
    <text x="480" y="314" font-size="17">2. Set role and access</text>
    <text x="790" y="314" font-size="17">3. Save and check</text>
    <text x="480" y="379" font-size="15" fill="#e4c695">Unclear save? Reload, inspect current access, then choose again.</text>
    <text x="480" y="407" font-size="13" fill="#c1c2cb">No automatic repeat. Earlier work and history stay saved.</text>
  </g>
</svg>
