<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1000" viewBox="0 0 440 1000" role="img" aria-labelledby="title desc">
<title id="title">How a saved invoice check works</title>
<desc id="desc">Choose the pair: Invoice and purchase order. Then Save one check: Keep both document choices. Then Check details: Review each document. Then Save the exact versions: Use completed reviews only. Then Backend comparison: Check values and evidence. Then Read the outcome: Passed, differed or could not check. Then Record a decision: Keep check results unchanged. Then Download the result: One saved snapshot for HTML and CSV.</desc>
<rect width="440" height="1000" rx="20" fill="#f5f5fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7866ac"/></marker></defs>
<rect x="20" y="20" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Choose the pair</text>
<text x="220" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Invoice and purchase order</text>
<path d="M220 110 V132" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="142" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Save one check</text>
<text x="220" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Keep both document choices</text>
<path d="M220 232 V254" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="264" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Check details</text>
<text x="220" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Review each document</text>
<path d="M220 354 V376" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Save the exact versions</text>
<text x="220" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Use completed reviews only</text>
<path d="M220 476 V498" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="508" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Backend comparison</text>
<text x="220" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Check values and evidence</text>
<path d="M220 598 V620" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="630" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Read the outcome</text>
<text x="220" y="692" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Passed, differed or could not check</text>
<path d="M220 720 V742" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="752" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="786" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Record a decision</text>
<text x="220" y="814" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Keep check results unchanged</text>
<path d="M220 842 V864" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="874" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="908" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Download the result</text>
<text x="220" y="936" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">One saved snapshot for HTML and CSV</text>
</svg>
