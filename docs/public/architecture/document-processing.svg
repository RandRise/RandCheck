<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1000" viewBox="0 0 440 1000" role="img" aria-labelledby="title desc">
<title id="title">How one document is processed</title>
<desc id="desc">Browser: Upload a document. Then API: Check and store the file. Then Database: Queue the extraction job. Then .NET worker: Pick up the saved job. Then Private Python service: Extract text and values. Then Database: Save values and page evidence. Then Human review: Check the values explicitly. Then Saved review: Use for comparisons or questions.</desc>
<rect width="440" height="1000" rx="20" fill="#f5f5fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7866ac"/></marker></defs>
<rect x="20" y="20" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Browser</text>
<text x="220" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Upload a document</text>
<path d="M220 110 V132" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="142" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">API</text>
<text x="220" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Check and store the file</text>
<path d="M220 232 V254" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="264" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Database</text>
<text x="220" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Queue the extraction job</text>
<path d="M220 354 V376" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="386" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">.NET worker</text>
<text x="220" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Pick up the saved job</text>
<path d="M220 476 V498" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="508" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Private Python service</text>
<text x="220" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Extract text and values</text>
<path d="M220 598 V620" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="630" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Database</text>
<text x="220" y="692" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Save values and page evidence</text>
<path d="M220 720 V742" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="752" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="786" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Human review</text>
<text x="220" y="814" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Check the values explicitly</text>
<path d="M220 842 V864" fill="none" stroke="#7866ac" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="874" width="400" height="90" rx="12" fill="white" stroke="#c7bfdc"/>
<text x="220" y="908" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#252331">Saved review</text>
<text x="220" y="936" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#504b61">Use for comparisons or questions</text>
</svg>
